# Render Blueprint: API «Кварты». Пошаговая инструкция — в README, раздел «Деплой».
# New → Blueprint → выбрать репозиторий: Render прочитает этот файл и создаст сервис.
services:
  - type: web
    name: kvarta-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # строка подключения Neon — вводится в дашборде, в git не попадает
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
